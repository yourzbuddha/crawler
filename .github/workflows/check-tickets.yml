name: Check Sagrada Familia tickets

on:
  schedule:
    # Avoid the busiest start-of-hour period. Scheduled workflows use UTC.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sagrada-ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ticket availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAGRADA_WEBHOOK_URL: ${{ secrets.SAGRADA_WEBHOOK_URL }}
        run: >-
          python3 watcher.py
          --once
          --no-desktop-notification
          --state-file /tmp/sagrada-watcher-state.json
